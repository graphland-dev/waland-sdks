[package]
name = "waland"
version = "0.1.0"
edition = "2021"
description = "Official Rust SDK for the Waland WhatsApp API"
license = "MIT"
repository = "https://github.com/graphland-dev/waland-sdks"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
urlencoding = "2"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
